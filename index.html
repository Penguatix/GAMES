<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Game Hub</title>
    <link rel="stylesheet" href="style.css"> 
</head>
<body>

    <header>
        <h1>GAME TIME!!!</h1>
        <p>Select a game below to start playing!</p>
    </header>

    <main class="games-container">
        
        <div class="game-card">
            <h2>Tic Tac Toe</h2>
            <p>The classic 3x3 battle of X's and O's.</p>
            <a href="https://penguatix.github.io/Tic-Tac-Toe/" class="play-button">Play Tic Tac Toe</a>
        </div>

        <div class="game-card">
            <h2>Rock Paper Scissors</h2>
            <p>Test your luck against the computer.</p>
            <a href="https://penguatix.github.io/RockPaperScissors/" class="play-button">Play R.P.S.</a>
        </div>

    </main>

</body>
</html>
